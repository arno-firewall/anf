# ------------------------------------------------------------------------------
#                 -= Arno's (NFT) Firewall(ANF) - Docker plugin =-
# ------------------------------------------------------------------------------

# To actually enable this plugin make ENABLED=1:
# ------------------------------------------------------------------------------
ENABLED=0

# The Docker (bridge) interfaces. "docker0" is Docker's default bridge, "br-+"
# matches the bridges of user-defined Docker networks (br-<network id>).
# Note: "br-+" also matches other bridges with a name starting with "br-".
#
# Traffic from these interfaces is forwarded (Docker masquerades it itself), to
# these interfaces only published ports (connections Docker DNATed) are.
#
# Also note that Docker sets the FORWARD policy of its own table to DROP, which
# also drops the traffic this firewall forwards (eg. NAT). To prevent that, add
# "ip-forward-no-drop": true to /etc/docker/daemon.json and restart Docker.
# ------------------------------------------------------------------------------
DOCKER_IF="docker0 br-+"
